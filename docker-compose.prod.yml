services:
  app:
    image: ${APP_IMAGE:-delivery-app:prod}
    build:
      context: .
      target: runner
    restart: always
    env_file:
      - ./env/production.app.env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    restart: always
    env_file:
      - ./env/production.mongo.env
    command: ['--auth', '--wiredTigerCacheSizeGB', '1']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init-simple.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    restart: always
    depends_on:
      - app
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      - prometheus
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_logs:
  app_uploads:
  mongodb_data:
  prometheus_data:
  grafana_data:
