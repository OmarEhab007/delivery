groups:
  - name: delivery_recording_rules
    interval: 30s
    rules:
      # HTTP request rates
      - record: job:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m])) by (job)

      # Error rates
      - record: job:http_errors:rate5m
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job)

      # P95 latency
      - record: job:http_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))

      # P99 latency
      - record: job:http_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))

      # Error rate ratio
      - record: job:error_rate:ratio5m
        expr: job:http_errors:rate5m / job:http_requests:rate5m

      # Request rate by route (pre-aggregated)
      - record: route:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m])) by (route)

      # Database operations rate
      - record: job:database_operations:rate5m
        expr: sum(rate(database_operations_total[5m])) by (job)

      # Database operation rate by collection
      - record: collection:database_operations:rate5m
        expr: sum(rate(database_operations_total[5m])) by (collection)
