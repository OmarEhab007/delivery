global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Data retention configuration
# Note: Set via command line flag --storage.tsdb.retention.time=15d in docker-compose.yml

# Alert rule files
rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'delivery-app'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:3000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'delivery-app'
